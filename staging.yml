name: Deploy to Staging
on:
  push:
    branches: [staging]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build and push image
        run: |
          docker build -t ghcr.io/${{ github.repository }}:staging .
          docker push ghcr.io/${{ github.repository }}:staging
      - name: Deploy to Staging EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_STAGING_KEY }}
          script: |
            docker pull ghcr.io/swe40006-cl09-g02/swe40006-cl09-project-1:latest
            docker stop staging-app && docker rm staging-app
            docker run -d --name staging-app --env-file /home/ubuntu/.env.staging -p 3000:3000 --restart unless-stopped ghcr.io/swe40006-cl09-g02/swe40006-cl09-project-1:latest
