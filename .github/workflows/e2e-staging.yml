name: E2E (Staging)

# End-to-end acceptance tests run against the DEPLOYED Staging environment.
#
# This is the end-to-end layer required by the assignment (unit + integration
# + E2E). It is intentionally separate from ci.yml (unit + integration) because
# it must run AFTER the application has been deployed to Staging, against the
# live Staging URL.
#
# Triggers:
#   1. workflow_run - automatically after the Staging deployment workflow
#      finishes successfully. Add the Staging deploy workflow's `name:` to the
#      list below once it is merged (task B2). "Publish image" is included now
#      because it is the current staging-branch workflow.
#   2. workflow_dispatch - manual runs and the live demo (Level 4), optionally
#      overriding the target URL.
#
# Configuration:
#   Set a repository variable STAGING_URL (Settings -> Secrets and variables ->
#   Actions -> Variables) to the public Staging URL, e.g. http://<staging-ip>.
#   A manual run can override it with the `staging_url` input below.

on:
  workflow_run:
    workflows:
      - 'Deploy to Staging'
      # - 'Deploy Staging'   # <- add task B2's staging deploy workflow name here
    types:
      - completed
  workflow_dispatch:
    inputs:
      staging_url:
        description: 'Staging base URL to test against (overrides the STAGING_URL variable)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-staging
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E against Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # For workflow_run triggers, only run when the deployment actually succeeded.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Resolve Staging URL
        id: url
        run: |
          URL="${{ github.event.inputs.staging_url }}"
          if [ -z "$URL" ]; then
            URL="${{ vars.STAGING_URL }}"
          fi
          if [ -z "$URL" ]; then
            echo "::error::No Staging URL provided. Set the STAGING_URL repository variable or pass the staging_url input."
            exit 1
          fi
          echo "staging_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Testing against: $URL"

      - name: Wait for Staging to be healthy
        env:
          STAGING_URL: ${{ steps.url.outputs.staging_url }}
        run: |
          echo "Waiting for $STAGING_URL/health ..."
          for i in $(seq 1 24); do
            if curl -fsS "$STAGING_URL/health" > /dev/null; then
              echo "Staging is healthy."
              exit 0
            fi
            echo "Attempt $i: not ready yet, retrying in 5s..."
            sleep 5
          done
          echo "::error::Staging did not become healthy in time."
          exit 1

      - name: Run Playwright E2E tests
        env:
          CI: 'true'
          STAGING_URL: ${{ steps.url.outputs.staging_url }}
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
