name: E2E (Staging)

# End-to-end acceptance tests (Playwright), run against the DEPLOYED Staging
# environment after the Staging deployment. They are separate from ci.yml
# (unit and integration tests) because they need the live Staging URL.
#
# Triggers:
#   1. Called by pipeline.yml after the Staging deployment.
#   2. workflow_run - after a manual run of "Deploy to Staging" completes.
#   3. workflow_dispatch - manual runs, optionally overriding the target URL.
#
# Configuration:
#   Set a repository variable STAGING_URL (Settings -> Secrets and variables ->
#   Actions -> Variables) to the public Staging URL, e.g. http://<staging-ip>.
#   A manual run can override it with the `staging_url` input below.

on:
  workflow_run:
    workflows:
      - 'Deploy to Staging'
    types:
      - completed
  workflow_dispatch:
    inputs:
      staging_url:
        description: 'Staging base URL to test against (overrides the STAGING_URL variable)'
        required: false
        type: string
  # Called by pipeline.yml after the staging deployment
  workflow_call:

permissions:
  contents: read

concurrency:
  group: e2e-staging
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E against Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # For workflow_run triggers, only run when the deployment actually succeeded.
    # Manual runs and runs called from pipeline.yml always go ahead.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Resolve Staging URL
        id: url
        env:
          INPUT_URL: ${{ github.event.inputs.staging_url }}
          VAR_URL: ${{ vars.STAGING_URL }}
        run: |
          URL="$INPUT_URL"
          if [ -z "$URL" ]; then
            URL="$VAR_URL"
          fi
          if [ -z "$URL" ]; then
            echo "::error::No Staging URL provided. Set the STAGING_URL repository variable or pass the staging_url input."
            exit 1
          fi
          echo "staging_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Testing against: $URL"

      - name: Wait for Staging to be healthy
        env:
          STAGING_URL: ${{ steps.url.outputs.staging_url }}
        run: |
          echo "Waiting for $STAGING_URL/health ..."
          for i in $(seq 1 24); do
            if curl -fsS "$STAGING_URL/health" > /dev/null; then
              echo "Staging is healthy."
              exit 0
            fi
            echo "Attempt $i: not ready yet, retrying in 5s..."
            sleep 5
          done
          echo "::error::Staging did not become healthy in time."
          exit 1

      - name: Run Playwright E2E tests
        env:
          CI: 'true'
          STAGING_URL: ${{ steps.url.outputs.staging_url }}
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
