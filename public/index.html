<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>DevOps Task Manager</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main>

    <h1>DevOps Task Manager</h1>

    <p>
      SWE40006 - Software Deployment and Evolution
    </p>

    <form id="task-form">

      <input
        type="text"
        id="title"
        placeholder="Task title"
        required
      >

      <textarea
        id="description"
        placeholder="Description (optional)"
      ></textarea>

      <button type="submit">
        Add Task
      </button>

    </form>

    <div id="task-filters">

      <button
        type="button"
        class="filter-button active"
        data-status="all"
        onclick="setFilter('all')"
      >
        All
      </button>

      <button
        type="button"
        class="filter-button"
        data-status="pending"
        onclick="setFilter('pending')"
      >
        Pending
      </button>

      <button
        type="button"
        class="filter-button"
        data-status="in_progress"
        onclick="setFilter('in_progress')"
      >
        In Progress
      </button>

      <button
        type="button"
        class="filter-button"
        data-status="completed"
        onclick="setFilter('completed')"
      >
        Completed
      </button>

    </div>

    <div id="task-list">
      Loading tasks...
    </div>

  </main>

  <script src="app.js"></script>

</body>

</html>
